<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aline Alves | Psicóloga Clínica</title>

  <!-- descrição que o Google mostra embaixo do link -->
  <meta name="description" content="Atendimento psicológico online e presencial. Especialista em Gestalt-terapia e comportamento alimentar. Agende sua consulta e inicie sua jornada terapêutica." />

  <!-- Título que aparece no card do WhatsApp -->
  <meta property="og:title" content="Aline Alves | Psicóloga Clínica" />

  <!-- Descrição curta do card -->
  <meta property="og:description" content="Especialista em Gestalt-terapia e comportamento alimentar. Agende sua consulta." />

  <!-- A imagem que vai aparecer quando for enviado o link do site para alguém - foto fica na pasta public-->
  <meta property="og:image" content="../public/aline-girassol.jpg" />

  <!-- Define que é um site padrão -->
  <meta property="og:type" content="website" />

  <!-- Idioma do site -->
  <meta property="og:locale" content="pt_BR" />

  <!-- Fonts Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

  <div id="root">

  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
